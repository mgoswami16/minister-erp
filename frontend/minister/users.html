<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0">
    <title>User Management |
        Minister Office ERP</title>
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="../assets/css/main.css">
    <link rel="stylesheet"
        href="../assets/css/dashboard.css">
    <link rel="stylesheet"
        href="../assets/css/components.css">
</head>
<body>

<div class="app-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar"
        style="background:linear-gradient(
        180deg,#1a0033 0%,#4a0080 100%)">

        <div class="sidebar-header">
            <div class="sidebar-logo"
                style="background:linear-gradient(
                135deg,#FFD700,#FFA500)">
                <i class="fas fa-crown"
                    style="color:#1a0033">
                </i>
            </div>
            <div class="sidebar-title">
                <h2>Minister ERP</h2>
                <span>Super Admin</span>
            </div>
        </div>

        <div class="sidebar-profile">
            <div class="profile-avatar
                user-avatar"
                style="background:linear-gradient(
                135deg,#FFD700,#FFA500);
                color:#1a0033">MA
            </div>
            <div class="profile-info">
                <h4 class="user-name">
                    Minister</h4>
                <span style="color:
                    rgba(255,215,0,0.8)">
                    SUPER ADMIN
                </span>
            </div>
        </div>

        <nav class="sidebar-nav">
            <div class="nav-section">
                <a href="dashboard.html"
                    class="nav-item">
                    <i class="fas
                        fa-tachometer-alt">
                    </i>
                    <span>Dashboard</span>
                </a>
                <a href="all-complaints.html"
                    class="nav-item">
                    <i class="fas
                        fa-clipboard-list">
                    </i>
                    <span>All Complaints</span>
                </a>
                <a href="analytics.html"
                    class="nav-item">
                    <i class="fas
                        fa-chart-bar"></i>
                    <span>Analytics</span>
                </a>
                <a href="users.html"
                    class="nav-item active">
                    <i class="fas
                        fa-users-cog"></i>
                    <span>Users</span>
                </a>
            </div>
        </nav>

        <div class="sidebar-footer">
            <button class="nav-item"
                onclick="AUTH.logout()">
                <i class="fas
                    fa-sign-out-alt"></i>
                <span>Logout</span>
            </button>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content"
        id="mainContent">

        <!-- Header -->
        <header class="top-header">
            <div class="header-left">
                <button class="sidebar-toggle"
                    id="sidebarToggle">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="page-title">
                    <h1>User Management</h1>
                    <p>Manage system users
                        and officers</p>
                </div>
            </div>
            <div class="header-right">
                <div class="header-datetime">
                    <span class="time"
                        id="currentTime"></span>
                    <span class="date"
                        id="currentDate"></span>
                </div>
                <button class="btn btn-primary"
                    onclick="UTILS.openModal(
                    'addUserModal')">
                    <i class="fas fa-plus">
                    </i>
                    Add New User
                </button>
            </div>
        </header>

        <!-- Page Content -->
        <div class="page-content">

            <!-- Filter Bar -->
            <div class="filter-bar">
                <div class="search-bar"
                    style="flex:1">
                    <i class="fas fa-search">
                    </i>
                    <input type="text"
                        id="searchInput"
                        placeholder=
                        "Search users...">
                </div>
                <select id="roleFilter"
                    class="filter-select"
                    onchange="applyFilter()">
                    <option value="">
                        All Roles
                    </option>
                    <option value="MINISTER">
                        Minister
                    </option>
                    <option value="OPERATOR">
                        Operator
                    </option>
                    <option value="OFFICER">
                        Officer
                    </option>
                </select>
                <select id="statusFilter"
                    class="filter-select"
                    onchange="applyFilter()">
                    <option value="">
                        All Status
                    </option>
                    <option value="true">
                        Active
                    </option>
                    <option value="false">
                        Inactive
                    </option>
                </select>
                <button class="btn
                    btn-outline btn-sm"
                    onclick="loadUsers()">
                    <i class="fas fa-sync">
                    </i>
                    Refresh
                </button>
            </div>

            <!-- Users Grid -->
            <div id="usersGrid"
                style="display:grid;
                grid-template-columns:
                repeat(auto-fill,
                minmax(320px,1fr));
                gap:16px">
                <div style="grid-column:
                    1/-1;text-align:center;
                    padding:40px;color:#999">
                    <i class="fas fa-spinner
                        fa-spin"
                        style="font-size:
                        2rem"></i>
                    <p>Loading users...</p>
                </div>
            </div>

        </div>
    </main>
</div>

<!-- Add User Modal -->
<div class="modal-overlay"
    id="addUserModal">
    <div class="modal">
        <div class="modal-header">
            <h3>
                <i class="fas
                    fa-user-plus"></i>
                Add New User
            </h3>
            <button class="modal-close"
                onclick="UTILS.closeModal(
                'addUserModal')">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="modal-body">
            <form id="addUserForm">
                <div class="form-row">
                    <div class="form-group">
                        <label class=
                            "form-label">
                            Full Name
                            <span>*</span>
                        </label>
                        <input type="text"
                            name="name"
                            class="form-control"
                            placeholder=
                            "Enter full name"
                            required>
                    </div>
                    <div class="form-group">
                        <label class=
                            "form-label">
                            Mobile
                            <span>*</span>
                        </label>
                        <input type="tel"
                            name="mobile"
                            class="form-control"
                            placeholder=
                            "10-digit mobile"
                            maxlength="10"
                            required>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">
                        Email
                    </label>
                    <input type="email"
                        name="email"
                        class="form-control"
                        placeholder=
                        "Email address">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class=
                            "form-label">
                            Username
                            <span>*</span>
                        </label>
                        <input type="text"
                            name="username"
                            class="form-control"
                            placeholder=
                            "Login username"
                            required>
                    </div>
                    <div class="form-group">
                        <label class=
                            "form-label">
                            Password
                            <span>*</span>
                        </label>
                        <input type="password"
                            name="password"
                            class="form-control"
                            placeholder=
                            "Set password"
                            required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class=
                            "form-label">
                            Role
                            <span>*</span>
                        </label>
                        <div class=
                            "select-wrapper">
                            <select
                                name="role"
                                class=
                                "form-control"
                                required>
                                <option value="">
                                    Select Role
                                </option>
                                <option
                                    value=
                                    "OPERATOR">
                                    Operator
                                </option>
                                <option
                                    value=
                                    "OFFICER">
                                    Officer
                                </option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class=
                            "form-label">
                            Department
                        </label>
                        <div class=
                            "select-wrapper">
                            <select
                                name=
                                "department"
                                class=
                                "form-control">
                                <option value="">
                                    Select Dept
                                </option>
                                <option
                                    value=
                                    "KANNAUJ">
                                    Kannauj
                                </option>
                                <option
                                    value=
                                    "POLICE">
                                    Police/Crime
                                </option>
                                <option
                                    value=
                                    "CORRESPONDENCE">
                                    Correspondence
                                </option>
                                <option
                                    value=
                                    "WESTERN_UP">
                                    Western UP
                                </option>
                                <option
                                    value=
                                    "APPOINTMENTS">
                                    Appointments
                                </option>
                                <option
                                    value="BJP">
                                    BJP/RSS
                                </option>
                                <option
                                    value=
                                    "CONTROL_ROOM">
                                    Control Room
                                </option>
                            </select>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn btn-outline"
                onclick="UTILS.closeModal(
                'addUserModal')">
                Cancel
            </button>
            <button class="btn btn-primary"
                onclick="addUser()">
                <i class="fas
                    fa-user-plus"></i>
                Add User
            </button>
        </div>
    </div>
</div>

<!-- Edit User Modal -->
<div class="modal-overlay"
    id="editUserModal">
    <div class="modal">
        <div class="modal-header">
            <h3>
                <i class="fas
                    fa-user-edit"></i>
                Edit User
            </h3>
            <button class="modal-close"
                onclick="UTILS.closeModal(
                'editUserModal')">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="modal-body">
            <form id="editUserForm">
                <input type="hidden"
                    id="editUserId">
                <div class="form-row">
                    <div class="form-group">
                        <label class=
                            "form-label">
                            Full Name
                            <span>*</span>
                        </label>
                        <input type="text"
                            id="editName"
                            name="name"
                            class="form-control"
                            required>
                    </div>
                    <div class="form-group">
                        <label class=
                            "form-label">
                            Mobile
                        </label>
                        <input type="tel"
                            id="editMobile"
                            name="mobile"
                            class="form-control"
                            maxlength="10">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">
                        Email
                    </label>
                    <input type="email"
                        id="editEmail"
                        name="email"
                        class="form-control">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class=
                            "form-label">
                            Role
                        </label>
                        <div class=
                            "select-wrapper">
                            <select
                                id="editRole"
                                name="role"
                                class=
                                "form-control">
                                <option
                                    value=
                                    "OPERATOR">
                                    Operator
                                </option>
                                <option
                                    value=
                                    "OFFICER">
                                    Officer
                                </option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class=
                            "form-label">
                            Department
                        </label>
                        <div class=
                            "select-wrapper">
                            <select
                                id=
                                "editDepartment"
                                name=
                                "department"
                                class=
                                "form-control">
                                <option
                                    value=
                                    "KANNAUJ">
                                    Kannauj
                                </option>
                                <option
                                    value=
                                    "POLICE">
                                    Police
                                </option>
                                <option
                                    value=
                                    "CORRESPONDENCE">
                                    Correspondence
                                </option>
                                <option
                                    value=
                                    "WESTERN_UP">
                                    Western UP
                                </option>
                                <option
                                    value=
                                    "APPOINTMENTS">
                                    Appointments
                                </option>
                                <option
                                    value="BJP">
                                    BJP/RSS
                                </option>
                                <option
                                    value=
                                    "CONTROL_ROOM">
                                    Control Room
                                </option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">
                        New Password
                        <span style="font-size:
                            0.75rem;color:
                            var(--gray);
                            font-weight:400">
                            (leave blank to keep)
                        </span>
                    </label>
                    <input type="password"
                        id="editPassword"
                        name="password"
                        class="form-control"
                        placeholder=
                        "Enter new password">
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn btn-outline"
                onclick="UTILS.closeModal(
                'editUserModal')">
                Cancel
            </button>
            <button class="btn btn-primary"
                onclick="updateUser()">
                <i class="fas fa-save"></i>
                Save Changes
            </button>
        </div>
    </div>
</div>

<!-- Notification Panel -->
<div class="notification-panel"
    id="notificationPanel">
    <div class="notification-panel-header">
        <h3>
            <i class="fas fa-bell"></i>
            Notifications
        </h3>
        <button class="modal-close"
            onclick="UTILS
            .toggleNotificationPanel()">
            <i class="fas fa-times"></i>
        </button>
    </div>
    <div class="notification-list"
        id="notificationList"></div>
</div>

<div id="toastContainer"
    class="toast-container"></div>

<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/utils.js"></script>

<script>
// ── Guard Page
AUTH.guardPage('MINISTER');

let allUsers = [];

// ── Initialize
document.addEventListener(
    'DOMContentLoaded', async () => {
    UTILS.init();
    await loadUsers();

    document.getElementById('searchInput')
        ?.addEventListener('input',
        UTILS.debounce(applyFilter, 300));
});

// ── Load Users
async function loadUsers() {
    try {
        UTILS.showLoading(true);
        const result = await API.users
            .getAll();

        if (result && result.success) {
            allUsers = result.data || [];
            renderUsers(allUsers);
        }
    } catch (e) {
        UTILS.showToast(
            'Failed to load users',
            'error');
    } finally {
        UTILS.showLoading(false);
    }
}

// ── Render Users Grid
function renderUsers(users) {
    const grid = document
        .getElementById('usersGrid');

    if (!users || users.length === 0) {
        grid.innerHTML = `
            <div class="empty-state"
                style="grid-column:1/-1">
                <i class="fas fa-users"></i>
                <h3>No users found</h3>
                <p>Add new users using
                    the button above</p>
            </div>`;
        return;
    }

    grid.innerHTML = users.map(u => `
        <div class="user-card"
            style="opacity:${u.active
                ? '1' : '0.6'}">
            <div class="user-card-avatar
                ${u.role.toLowerCase()}">
                ${UTILS.getInitials(u.name)}
            </div>
            <div class="user-card-info">
                <h4>${u.name}</h4>
                <p>${u.username}
                    | ${u.mobile || '-'}</p>
                <div class="user-card-meta">
                    <span class=
                        "user-meta-tag">
                        <i class="fas
                            fa-tag"></i>
                        ${u.role}
                    </span>
                    ${u.department
                    ? `<span class=
                        "user-meta-tag">
                        <i class="fas
                            fa-building">
                        </i>
                        ${u.department}
                    </span>` : ''}
                    <span class=
                        "user-meta-tag"
                        style="color:
                        ${u.active
                            ? '#28A745'
                            : '#DC3545'}">
                        <i class="fas
                            ${u.active
                            ? 'fa-check-circle'
                            : 'fa-times-circle'}">
                        </i>
                        ${u.active
                            ? 'Active'
                            : 'Inactive'}
                    </span>
                </div>
            </div>
            <div class="user-card-actions">
                <button class="btn
                    btn-outline btn-sm"
                    onclick="editUser(
                    '${u.userId}',
                    '${u.name}',
                    '${u.mobile || ''}',
                    '${u.email || ''}',
                    '${u.role}',
                    '${u.department || ''}')">
                    <i class="fas
                        fa-edit"></i>
                    Edit
                </button>
                <button class="btn btn-sm"
                    style="background:
                    ${u.active
                        ? '#FFEBEE'
                        : '#E8F5E9'};
                    color:${u.active
                        ? '#DC3545'
                        : '#28A745'};
                    border:1px solid
                    ${u.active
                        ? '#DC3545'
                        : '#28A745'}"
                    onclick=
                    "toggleStatus(
                    '${u.userId}',
                    '${u.name}',
                    ${u.active})">
                    <i class="fas
                        ${u.active
                        ? 'fa-user-slash'
                        : 'fa-user-check'}">
                    </i>
                    ${u.active
                        ? 'Disable'
                        : 'Enable'}
                </button>
                <button class="btn btn-sm"
                    style="background:
                    var(--blue-pale);
                    color:var(--blue);
                    border:1px solid
                    var(--blue)"
                    onclick=
                    "sendUserReminder(
                    '${u.userId}',
                    '${u.name}')">
                    <i class="fas fa-bell">
                    </i>
                    Remind
                </button>
            </div>
        </div>
    `).join('');
}

// ── Apply Filter
function applyFilter() {
    const search = document
        .getElementById('searchInput')
        ?.value.toLowerCase() || '';
    const role = document
        .getElementById('roleFilter')
        ?.value || '';
    const status = document
        .getElementById('statusFilter')
        ?.value || '';

    const filtered = allUsers.filter(u => {
        const matchSearch = !search
            || u.name.toLowerCase()
                .includes(search)
            || u.username.toLowerCase()
                .includes(search)
            || (u.mobile || '')
                .includes(search);
        const matchRole = !role
            || u.role === role;
        const matchStatus = !status
            || u.active.toString() === status;

        return matchSearch
            && matchRole
            && matchStatus;
    });

    renderUsers(filtered);
}

// ── Add User
async function addUser() {
    const data = UTILS.getFormData(
        'addUserForm');

    if (!data.name || !data.username
            || !data.password || !data.role
            || !data.mobile) {
        UTILS.showToast(
            'Please fill all required fields',
            'warning');
        return;
    }

    if (!UTILS.validateMobile(data.mobile)) {
        UTILS.showToast(
            'Enter valid mobile number',
            'warning');
        return;
    }

    UTILS.showLoading(true);
    const result = await API.users
        .create(data);
    UTILS.showLoading(false);

    if (result && result.success) {
        UTILS.showToast(
            `User ${data.name} created`,
            'success');
        UTILS.closeModal('addUserModal');
        UTILS.resetForm('addUserForm');
        await loadUsers();
    } else {
        UTILS.showToast(
            result?.message
            || 'Failed to create user',
            'error');
    }
}

// ── Edit User
function editUser(id, name, mobile,
        email, role, department) {
    document.getElementById('editUserId')
        .value = id;
    document.getElementById('editName')
        .value = name;
    document.getElementById('editMobile')
        .value = mobile;
    document.getElementById('editEmail')
        .value = email;
    document.getElementById('editRole')
        .value = role;
    document.getElementById('editDepartment')
        .value = department;
    document.getElementById('editPassword')
        .value = '';

    UTILS.openModal('editUserModal');
}

// ── Update User
async function updateUser() {
    const id = document
        .getElementById('editUserId').value;
    const data = {
        name: document
            .getElementById('editName').value,
        mobile: document
            .getElementById('editMobile').value,
        email: document
            .getElementById('editEmail').value,
        role: document
            .getElementById('editRole').value,
        department: document
            .getElementById('editDepartment')
            .value,
        password: document
            .getElementById('editPassword')
            .value,
        isActive: true
    };

    UTILS.showLoading(true);
    const result = await API.users
        .update(id, data);
    UTILS.showLoading(false);

    if (result && result.success) {
        UTILS.showToast(
            'User updated successfully',
            'success');
        UTILS.closeModal('editUserModal');
        await loadUsers();
    } else {
        UTILS.showToast(
            result?.message
            || 'Update failed',
            'error');
    }
}

// ── Toggle User Status
async function toggleStatus(id,
        name, isActive) {
    UTILS.confirm(
        `${isActive ? 'Disable' : 'Enable'}
        user ${name}?`,
        async () => {
            const result = await API.users
                .toggleStatus(id);

            if (result && result.success) {
                UTILS.showToast(
                    `User ${name}
                    ${isActive
                        ? 'disabled'
                        : 'enabled'}
                    successfully`,
                    'success');
                await loadUsers();
            } else {
                UTILS.showToast(
                    'Status update failed',
                    'error');
            }
        },
        `${isActive
            ? 'Disable'
            : 'Enable'} User`
    );
}

// ── Send Reminder to User
async function sendUserReminder(
        userId, userName) {
    UTILS.confirm(
        `Send reminder to ${userName}?`,
        async () => {
            const result = await API
                .notifications.sendReminder(
                    userId,
                    userName,
                    'You have pending tasks.Please check your dashboard.',
                    null);

            if (result && result.success) {
                UTILS.showToast(
                    `Reminder sent to
                    ${userName}`,
                    'success');
            }
        },
        'Send Reminder'
    );
}
</script>

</body>
</html>
