<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0">
    <title>My Complaints |
        Minister Office ERP</title>
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="../assets/css/main.css">
    <link rel="stylesheet"
        href="../assets/css/dashboard.css">
    <link rel="stylesheet"
        href="../assets/css/components.css">
</head>
<body>

<div class="app-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar"
        style="background:linear-gradient(
        180deg,#002277 0%,#003399 100%)">

        <div class="sidebar-header">
            <div class="sidebar-logo"
                style="background:linear-gradient(
                135deg,#003399,#1a4db3)">
                <i class="fas fa-landmark">
                </i>
            </div>
            <div class="sidebar-title">
                <h2>Minister ERP</h2>
                <span>Officer Portal</span>
            </div>
        </div>

        <div class="sidebar-profile">
            <div class="profile-avatar
                user-avatar">OF</div>
            <div class="profile-info">
                <h4 class="user-name">
                    Officer</h4>
                <span class="user-dept">
                </span>
            </div>
        </div>

        <nav class="sidebar-nav">
            <div class="nav-section">
                <a href="dashboard.html"
                    class="nav-item">
                    <i class="fas
                        fa-tachometer-alt"></i>
                    <span>Dashboard</span>
                </a>
                <a href="my-complaints.html"
                    class="nav-item active">
                    <i class="fas
                        fa-clipboard-list"></i>
                    <span>My Complaints</span>
                </a>
            </div>
        </nav>

        <div class="sidebar-footer">
            <button class="nav-item"
                onclick="AUTH.logout()">
                <i class="fas
                    fa-sign-out-alt"></i>
                <span>Logout</span>
            </button>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content"
        id="mainContent">

        <!-- Header -->
        <header class="top-header">
            <div class="header-left">
                <button class="sidebar-toggle"
                    id="sidebarToggle">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="page-title">
                    <h1>My Complaints</h1>
                    <p>Manage your assigned
                        cases</p>
                </div>
            </div>
            <div class="header-right">
                <div class="header-datetime">
                    <span class="time"
                        id="currentTime"></span>
                    <span class="date"
                        id="currentDate"></span>
                </div>
                <button class="header-btn"
                    onclick="UTILS
                    .toggleNotificationPanel()">
                    <i class="fas fa-bell"></i>
                    <span class="badge-count"
                        id="notifCount"
                        style="display:none">0
                    </span>
                </button>
            </div>
        </header>

        <!-- Page Content -->
        <div class="page-content">

            <!-- Filter Bar -->
            <div class="filter-bar">
                <div class="search-bar"
                    style="flex:1">
                    <i class="fas fa-search">
                    </i>
                    <input type="text"
                        id="searchInput"
                        placeholder=
                        "Search complaints...">
                </div>
                <select id="statusFilter"
                    class="filter-select"
                    onchange="applyFilter()">
                    <option value="">
                        All Status
                    </option>
                    <option value="NEW">New
                    </option>
                    <option value="ASSIGNED">
                        Assigned
                    </option>
                    <option value="PENDING">
                        Pending
                    </option>
                    <option value=
                        "ACTION_TAKEN">
                        Action Taken
                    </option>
                    <option value="ESCALATED">
                        Escalated
                    </option>
                    <option value="RESOLVED">
                        Resolved
                    </option>
                </select>
                <select id="priorityFilter"
                    class="filter-select"
                    onchange="applyFilter()">
                    <option value="">
                        All Priority
                    </option>
                    <option value="CRITICAL">
                        Critical
                    </option>
                    <option value="HIGH">
                        High
                    </option>
                    <option value="MEDIUM">
                        Medium
                    </option>
                    <option value="LOW">
                        Low
                    </option>
                </select>
                <button class="btn
                    btn-outline btn-sm"
                    onclick="loadComplaints()">
                    <i class="fas fa-sync"></i>
                    Refresh
                </button>
            </div>

            <!-- Complaints Table -->
            <div class="card">
                <div class="card-header">
                    <h3>
                        <i class="fas
                            fa-clipboard-list">
                        </i>
                        Assigned Complaints
                        <span id="recordCount"
                            style="font-size:
                            0.8rem;color:
                            var(--gray);
                            font-weight:400;
                            margin-left:8px">
                        </span>
                    </h3>
                </div>
                <table class="table
                        table-striped"
                        id="complaintsTable">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>ID</th>
                                <th>Caller</th>
                                <th>District</th>
                                <th>Subject</th>
                                <th>Priority</th>
                                <th>Status</th>
                                <th>Date</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td colspan="9"
                                    style=
                                    "text-align:
                                    center;
                                    padding:40px;
                                    color:#999">
                                    <i class=
                                    "fas fa-spinner
                                    fa-spin"
                                    style=
                                    "font-size:
                                    2rem"></i>
                                    <p>Loading...
                                    </p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- Complaint Action Modal -->
<div class="modal-overlay"
    id="actionModal">
    <div class="modal"
        style="max-width:700px">
        <div class="modal-header">
            <h3>
                <i class="fas fa-tasks"></i>
                Update Complaint
                <span id="action_modal_id"
                    style="font-size:0.85rem;
                    color:var(--saffron);
                    font-family:monospace;
                    margin-left:8px">
                </span>
            </h3>
            <button class="modal-close"
                onclick="UTILS.closeModal(
                'actionModal')">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="modal-body">

            <!-- Complaint Info -->
            <div style="background:
                var(--off-white);
                border-radius:
                var(--border-radius-sm);
                padding:14px;
                margin-bottom:16px">
                <h4 id="action_subject"
                    style="font-size:0.95rem;
                    margin-bottom:6px">
                </h4>
                <p id="action_caller"
                    style="font-size:0.82rem;
                    color:var(--gray);
                    margin:0">
                </p>
            </div>

            <!-- Minister Direction -->
            <div id="directionBox"
                class="direction-box"
                style="display:none">
                <div class=
                    "direction-box-header">
                    <i class="fas
                        fa-directions"></i>
                    <h4>Minister Direction
                    </h4>
                </div>
                <p id="directionText"></p>
            </div>

            <!-- Status Actions -->
            <div class="status-panel">
                <h4 style="font-size:0.85rem;
                    margin-bottom:12px;
                    color:var(--dark-gray)">
                    Update Status:
                </h4>
                <div class="status-flow">
                    <button class="status-btn
                        pending"
                        onclick=
                        "setAction('PENDING')">
                        <i class="fas
                            fa-hourglass"></i>
                        Pending
                    </button>
                    <button class="status-btn
                        action-taken"
                        onclick=
                        "setAction(
                        'ACTION_TAKEN')">
                        <i class="fas
                            fa-check"></i>
                        Action Taken
                    </button>
                    <button class="status-btn
                        escalate"
                        onclick=
                        "setAction('ESCALATE')">
                        <i class="fas
                            fa-arrow-up"></i>
                        Escalate
                    </button>
                    <button class="status-btn
                        minister-review"
                        onclick=
                        "setAction(
                        'MINISTER_REVIEW')">
                        <i class="fas
                            fa-eye"></i>
                        Minister Review
                    </button>
                    <button class="status-btn
                        forward"
                        onclick=
                        "setAction('FORWARD')">
                        <i class="fas
                            fa-share"></i>
                        Forward
                    </button>
                </div>
            </div>

            <!-- Action Taken Input -->
            <div class="form-group"
                id="actionTakenGroup"
                style="margin-top:16px">
                <label class="form-label">
                    Action Taken / Remarks
                    <span>*</span>
                </label>
                <textarea
                    id="actionTakenText"
                    class="form-control"
                    rows="3"
                    placeholder=
                    "Describe action taken
                    or remarks...">
                </textarea>
            </div>

            <!-- Forward Officer Select -->
            <div id="forwardGroup"
                style="display:none;
                margin-top:12px">
                <label class="form-label">
                    Forward To Officer
                </label>
                <div class="select-wrapper">
                    <select
                        id="forwardOfficer"
                        class="form-control">
                        <option value="">
                            Select Officer
                        </option>
                    </select>
                </div>
            </div>

            <!-- Audit Trail -->
            <div style="margin-top:20px">
                <h4 style="font-size:0.85rem;
                    color:var(--dark-gray);
                    margin-bottom:12px;
                    display:flex;
                    align-items:center;
                    gap:8px">
                    <i class="fas fa-history"
                        style="color:
                        var(--saffron)"></i>
                    Activity Timeline
                </h4>
                <div id="auditTrail"
                    style="max-height:200px;
                    overflow-y:auto">
                </div>
            </div>

        </div>
        <div class="modal-footer">
            <button class="btn btn-outline"
                onclick="UTILS.closeModal(
                'actionModal')">
                Cancel
            </button>
            <button
                class="btn btn-primary"
                id="submitActionBtn"
                onclick="submitAction()">
                <i class="fas
                    fa-save"></i>
                Submit Update
            </button>
        </div>
    </div>
</div>

<!-- Notification Panel -->
<div class="notification-panel"
    id="notificationPanel">
    <div class="notification-panel-header">
        <h3>
            <i class="fas fa-bell"></i>
            Notifications
        </h3>
        <button class="modal-close"
            onclick="UTILS
            .toggleNotificationPanel()">
            <i class="fas fa-times"></i>
        </button>
    </div>
    <div class="notification-list"
        id="notificationList"></div>
</div>

<div id="toastContainer"
    class="toast-container"></div>

<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/utils.js"></script>
<script src="../assets/js/complaints.js">
</script>

<script>
// ── Guard Page
AUTH.guardPage('OFFICER');

let allData = [];
let currentAction = '';
let currentComplaintId = '';

// ── Initialize
document.addEventListener(
    'DOMContentLoaded', async () => {
    UTILS.init();
    await loadComplaints();

    // Load officers for forward
    await COMPLAINTS.loadOfficers(
        'forwardOfficer');

    // Search listener
    document.getElementById('searchInput')
        ?.addEventListener('input',
        UTILS.debounce(applyFilter, 300));

    // Check URL filter param
    const urlParams = new URLSearchParams(
        window.location.search);
    const filter = urlParams.get('filter');
    if (filter) {
        document.getElementById(
            'statusFilter').value = filter;
        applyFilter();
    }
});

// ── Load Complaints
async function loadComplaints() {
    try {
        UTILS.showLoading(true);
        const result = await API
            .complaints.getMy();

        if (result && result.success) {
            allData = result.data || [];
            renderTable(allData);
        }
    } catch (e) {
        UTILS.showToast(
            'Failed to load', 'error');
    } finally {
        UTILS.showLoading(false);
    }
}

// ── Render Table
function renderTable(data) {
    document.getElementById('recordCount')
        .textContent =
            `(${data.length} cases)`;

    UTILS.populateTable(
        'complaintsTable',
        data,
        (c, i) => `
        <tr>
            <td>${i + 1}</td>
            <td>
                <strong style="color:
                    var(--saffron);
                    font-family:monospace;
                    font-size:0.8rem">
                    ${c.complaintId}
                </strong>
            </td>
            <td>
                <strong>${c.callerName}
                </strong><br>
                <small style="color:
                    var(--gray)">
                    ${c.callerMobile}
                </small>
            </td>
            <td>${c.district || '-'}</td>
            <td title="${c.subject}">
                ${UTILS.truncate(
                    c.subject, 30)}
            </td>
            <td>${UTILS.getPriorityBadge(
                c.priority)}</td>
            <td>${UTILS.getStatusBadge(
                c.status)}</td>
            <td>
                <small style="color:
                    var(--gray)">
                    ${UTILS.formatDate(
                        c.createdDate)}
                </small>
            </td>
            <td>
                <button
                    class="btn btn-primary
                    btn-sm"
                    onclick="openAction(
                    '${c.complaintId}',
                    '${c.subject
                        .replace(/'/g, "\\'")}',
                    '${c.callerName}',
                    '${c.ministerDirection
                        || ''}')">
                    <i class="fas
                        fa-edit"></i>
                    Update
                </button>
            </td>
        </tr>`
    );
}

// ── Apply Filter
function applyFilter() {
    const search = document
        .getElementById('searchInput')
        ?.value.toLowerCase() || '';
    const status = document
        .getElementById('statusFilter')
        ?.value || '';
    const priority = document
        .getElementById('priorityFilter')
        ?.value || '';

    const filtered = allData.filter(c => {
        const matchSearch = !search
            || (c.callerName || '')
                .toLowerCase().includes(search)
            || (c.complaintId || '')
                .toLowerCase().includes(search)
            || (c.subject || '')
                .toLowerCase().includes(search);
        const matchStatus = !status
            || c.status === status;
        const matchPriority = !priority
            || c.priority === priority;
        return matchSearch
            && matchStatus
            && matchPriority;
    });

    renderTable(filtered);
}

// ── Open Action Modal
function openAction(id, subject,
        caller, direction) {
    currentComplaintId = id;
    currentAction = '';

    document.getElementById(
        'action_modal_id')
        .textContent = id;
    document.getElementById(
        'action_subject')
        .textContent = subject;
    document.getElementById(
        'action_caller')
        .textContent = `Caller: ${caller}`;
    document.getElementById(
        'actionTakenText').value = '';

    // Show direction if exists
    const dirBox = document
        .getElementById('directionBox');
    if (direction && direction !== 'null'
            && direction !== '') {
        dirBox.style.display = 'block';
        document.getElementById(
            'directionText')
            .textContent = direction;
    } else {
        dirBox.style.display = 'none';
    }

    // Hide forward group
    document.getElementById('forwardGroup')
        .style.display = 'none';

    // Load audit trail
    COMPLAINTS.loadAuditTrail(id);

    UTILS.openModal('actionModal');
}

// ── Set Action
function setAction(action) {
    currentAction = action;

    // Reset all buttons
    document.querySelectorAll('.status-btn')
        .forEach(btn => {
        btn.classList.remove('active');
    });

    // Highlight selected
    event.target.closest('.status-btn')
        ?.classList.add('active');

    // Show/hide forward group
    const forwardGroup = document
        .getElementById('forwardGroup');
    forwardGroup.style.display =
        action === 'FORWARD'
            ? 'block' : 'none';
}

// ── Submit Action
async function submitAction() {
    const remarks = document
        .getElementById('actionTakenText')
        .value.trim();

    if (!remarks) {
        UTILS.showToast(
            'Please enter remarks',
            'warning');
        return;
    }

    if (!currentAction) {
        UTILS.showToast(
            'Please select an action',
            'warning');
        return;
    }

    let result;

    switch(currentAction) {
        case 'PENDING':
        case 'ACTION_TAKEN':
            result = await API.complaints
                .updateStatus(
                    currentComplaintId,
                    currentAction,
                    remarks);
            break;

        case 'ESCALATE':
            result = await API.complaints
                .escalate(
                    currentComplaintId,
                    remarks);
            break;

        case 'MINISTER_REVIEW':
            result = await API.complaints
                .sendToMinister(
                    currentComplaintId,
                    remarks);
            break;

        case 'FORWARD':
            const select = document
                .getElementById(
                    'forwardOfficer');
            const option = select.options[
                select.selectedIndex];

            if (!option.value) {
                UTILS.showToast(
                    'Select officer to forward',
                    'warning');
                return;
            }

            result = await API.complaints
                .forward(
                    currentComplaintId,
                    option.value,
                    option.dataset.name
                    || option.text,
                    remarks);
            break;
    }

    if (result && result.success) {
        UTILS.showToast(
            'Updated successfully',
            'success');
        UTILS.closeAllModals();
        await loadComplaints();
    } else {
        UTILS.showToast(
            result?.message
            || 'Update failed',
            'error');
    }
}
</script>

</body>
</html>
