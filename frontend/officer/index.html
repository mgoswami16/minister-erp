<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0">
    <title>Officer Login |
        Minister Office ERP</title>
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="../assets/css/main.css">
</head>
<body>

<div class="login-page"
    style="background:linear-gradient(
    135deg,#002277 0%,#003399 50%,
    #1a4db3 100%)">

    <div class="login-container">
        <div class="login-card">

            <!-- Logo -->
            <div class="login-logo">
                <div class="emblem"
                    style="background:
                    linear-gradient(135deg,
                    #003399,#1a4db3)">
                    <i class="fas
                        fa-user-tie"></i>
                </div>
                <h1>Minister Office<br>
                    Control Room ERP</h1>
                <p>Hon. Shri Asim<p>Hon. Shri Asim Arun
                    | Uttar Pradesh</p>
            </div>

            <!-- Portal Badge -->
            <div class="login-title">
                <h2>Officer Login</h2>
                <span class="portal-badge
                    officer">
                    👮 Officer Portal
                </span>
            </div>

            <!-- Alert -->
            <div id="loginAlert"
                style="display:none"
                class="alert alert-danger">
                <i class="fas
                    fa-exclamation-circle">
                </i>
                <span id="alertMessage"></span>
            </div>

            <!-- Login Form -->
            <form id="loginForm"
                autocomplete="off">

                <div class="form-group">
                    <label class="form-label">
                        <i class="fas fa-user"
                            style="color:
                            var(--blue)">
                        </i>
                        Username
                        <span>*</span>
                    </label>
                    <div class="input-icon-group">
                        <i class="fas fa-user">
                        </i>
                        <input
                            type="text"
                            id="username"
                            name="username"
                            class="form-control"
                            placeholder=
                            "Enter your username"
                            required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <i class="fas fa-lock"
                            style="color:
                            var(--blue)">
                        </i>
                        Password
                        <span>*</span>
                    </label>
                    <div class="input-icon-group">
                        <i class="fas fa-lock">
                        </i>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-control"
                            placeholder=
                            "Enter your password"
                            required>
                        <button
                            type="button"
                            id="togglePassword"
                            class="toggle-password">
                            <i class="fas fa-eye">
                            </i>
                        </button>
                    </div>
                </div>

                <button
                    type="submit"
                    class="btn btn-secondary
                    btn-full btn-lg"
                    style="margin-top:8px;
                    background:linear-gradient(
                    135deg,var(--blue),
                    var(--blue-dark))">
                    <i class="fas
                        fa-sign-in-alt"></i>
                    Login to Officer Portal
                </button>

            </form>

            <div style="margin-top:24px;
                padding-top:20px;
                border-top:1px solid #F1F3F5;
                text-align:center">
                <p style="font-size:0.8rem;
                    color:var(--gray);margin:0">
                    <i class="fas fa-shield-alt"
                        style="color:var(--blue)">
                    </i>
                    Secure Government Portal
                    | For Officers Only
                </p>
            </div>

            <div style="margin-top:16px;
                text-align:center">
                <p style="font-size:0.75rem;
                    color:#ADB5BD;margin:0">
                    Minister Office ERP v1.0.0
                    | &copy; 2024
                </p>
            </div>

        </div>
    </div>
</div>

<div id="toastContainer"
    class="toast-container"></div>

<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/utils.js"></script>

<script>
    AUTH.initLoginPage('OFFICER');
</script>

</body>
</html>
