<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0">
    <title>Operator Login | Minister Office ERP</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon"
        href="../assets/img/favicon.ico">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect"
        href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet"
        href="../assets/css/main.css">

    <style>
        .login-page {
            background: linear-gradient(
                135deg,
                #CC4400 0%,
                #FF6600 40%,
                #FF8533 100%
            );
        }

        .login-page::before {
            background: radial-gradient(
                circle at center,
                rgba(255,255,255,0.1) 0%,
                transparent 60%
            );
        }

        .floating-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
            animation: float 8s
                ease-in-out infinite;
        }

        .shape:nth-child(1) {
            width: 200px;
            height: 200px;
            top: -50px;
            right: -50px;
            animation-delay: 0s;
        }

        .shape:nth-child(2) {
            width: 150px;
            height: 150px;
            bottom: 100px;
            left: -30px;
            animation-delay: 2s;
        }

        .shape:nth-child(3) {
            width: 80px;
            height: 80px;
            top: 40%;
            right: 10%;
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0)
                    rotate(0deg);
            }
            50% {
                transform: translateY(-20px)
                    rotate(10deg);
            }
        }
    </style>
</head>
<body>

<!-- Floating Shapes -->
<div class="floating-shapes">
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
</div>

<!-- Login Page -->
<div class="login-page">
    <div class="login-container">
        <div class="login-card">

            <!-- Logo -->
            <div class="login-logo">
                <div class="emblem">
                    <i class="fas
                        fa-headset"></i>
                </div>
                <h1>Minister Office<br>
                    Control Room ERP</h1>
                <p>Hon. Shri Asim Arun
                    | Uttar Pradesh</p>
            </div>

            <!-- Portal Badge -->
            <div class="login-title">
                <h2>Welcome Back</h2>
                <span class="portal-badge
                    operator">
                    📞 Operator Portal
                </span>
            </div>

            <!-- Alert -->
            <div id="loginAlert"
                style="display:none"
                class="alert alert-danger">
                <i class="fas
                    fa-exclamation-circle">
                </i>
                <span id="alertMessage">
                </span>
            </div>

            <!-- Login Form -->
            <form id="loginForm"
                autocomplete="off">

                <!-- Username -->
                <div class="form-group">
                    <label class="form-label">
                        <i class="fas fa-user"
                            style="color:
                            var(--saffron)">
                        </i>
                        Username
                        <span>*</span>
                    </label>
                    <div class="input-icon-group">
                        <i class="fas fa-user">
                        </i>
                        <input
                            type="text"
                            id="username"
                            name="username"
                            class="form-control"
                            placeholder=
                            "Enter your username"
                            required
                            autocomplete="off">
                    </div>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label class="form-label">
                        <i class="fas fa-lock"
                            style="color:
                            var(--saffron)">
                        </i>
                        Password
                        <span>*</span>
                    </label>
                    <div class="input-icon-group">
                        <i class="fas fa-lock">
                        </i>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="form-control"
                            placeholder=
                            "Enter your password"
                            required>
                        <button
                            type="button"
                            id="togglePassword"
                            class="toggle-password">
                            <i class="fas fa-eye">
                            </i>
                        </button>
                    </div>
                </div>

                <!-- Login Button -->
                <button
                    type="submit"
                    class="btn btn-primary
                    btn-full btn-lg"
                    style="margin-top:8px">
                    <i class="fas
                        fa-sign-in-alt"></i>
                    Login to Control Room
                </button>

            </form>

            <!-- Info -->
            <div style="margin-top:24px;
                padding-top:20px;
                border-top:1px solid #F1F3F5;
                text-align:center">
                <p style="font-size:0.8rem;
                    color:var(--gray);
                    margin:0">
                    <i class="fas fa-shield-alt"
                        style="color:
                        var(--saffron)"></i>
                    Secure Government Portal
                    | For Operators Only
                </p>
            </div>

            <!-- System Info -->
            <div style="margin-top:16px;
                text-align:center">
                <p style="font-size:0.75rem;
                    color:#ADB5BD;margin:0">
                    Minister Office ERP v1.0.0
                    | &copy; 2024
                </p>
            </div>

        </div>
    </div>
</div>

<!-- Toast Container -->
<div id="toastContainer"
    class="toast-container"></div>

<!-- JS Files -->
<script src="../assets/js/api.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/utils.js"></script>

<script>
    // Initialize login page
    // for OPERATOR role
    AUTH.initLoginPage('OPERATOR');
</script>

</body>
</html>
