# ═══════════════════════════════════════════════════
# MINISTER OFFICE ERP
# Hon. Minister Shri Asim Arun
# Spring Boot 3.3.5 | Java 21 | Mac
# ═══════════════════════════════════════════════════

# ─────────────────────────────────────────
# SERVER
# ─────────────────────────────────────────
server.port=8080
server.servlet.context-path=/api/v1

# ─────────────────────────────────────────
# APP INFO
# ─────────────────────────────────────────
spring.application.name=minister-erp

# ─────────────────────────────────────────
# GOOGLE SHEETS
# Used in: GoogleSheetsService.java
# Replace YOUR_SCRIPT_ID after deployment
# ─────────────────────────────────────────
google.sheets.script.url=https://script.google.com/macros/s/AKfycbyk_bYa3irIrDWcPpZ48EFBQ3tkbukaFfbIqEIlA0TvE4f4D0pvG1q-OQGyv8DY5rav/exec


# ─────────────────────────────────────────
# LOGGING
# ─────────────────────────────────────────
logging.level.com.ministererp=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=INFO
logging.file.name=logs/minister-erp.log
logging.pattern.console=%d{HH:mm:ss} %-5level %logger{36} - %msg%n

# ─────────────────────────────────────────
# JACKSON JSON
# Used in: All controllers and models
# ─────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.default-property-inclusion=non_null

# ─────────────────────────────────────────
# CACHE
# Used in: AppConfig.java @EnableCaching
# ─────────────────────────────────────────
spring.cache.type=simple

# ─────────────────────────────────────────
# ASYNC THREAD POOL
# Used in: AppConfig.java taskExecutor
# Used in: AuditService.java @Async
# Used in: NotificationService.java @Async
# ─────────────────────────────────────────
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=MinisterERP-Async-

# ─────────────────────────────────────────
# WEBCLIENT
# Used in: GoogleSheetsService.java WebClient
# Used in: AppConfig.java @Bean WebClient
# ─────────────────────────────────────────
spring.codec.max-in-memory-size=10MB

# ─────────────────────────────────────────
# FILE UPLOAD
# Used in: ReportController.java
# ─────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ─────────────────────────────────────────
# ERROR HANDLING
# Used in: GlobalExceptionHandler.java
# ─────────────────────────────────────────
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never

# ─────────────────────────────────────────
# DEVTOOLS
# Auto restart on code change (Dev only)
# ─────────────────────────────────────────
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true